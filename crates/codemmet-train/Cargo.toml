[package]
name = "codemmet-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The codemmet syntax trainer's pure state machine, content, and grading"

# codemmet-core without its native `dirs` feature, so this crate (and thus the
# trainer core) compiles for wasm32-unknown-unknown as well as native.
[dependencies]
codemmet-core = { path = "../codemmet-core", version = "0.4.0", default-features = false }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
