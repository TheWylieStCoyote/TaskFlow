name: playground

# Pages must be enabled (Settings → Pages → Source: GitHub Actions) for this to
# succeed. Runs on demand, and automatically when the playground or the code it
# builds from changes.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "playground/**"
      - "crates/codemmet-wasm/**"
      - "crates/codemmet-core/**"
      - "crates/codemmet-train/**"
      - ".github/workflows/playground.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the wasm module
        run: bash playground/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground
      - id: deploy
        uses: actions/deploy-pages@v5
