# Builtin Python snippet pack.
#
# Intentional trigger-prefix overlaps (longest trigger wins during resolution):
#   if / ifmain         — `ifmain` wins for the exact word; `if` has no params so
#                         nothing gluey can collide.
#   pr / prd / prop     — safe: `pr`/`prd` have no ident param; `prop` wins for the
#                         exact word and takes its own glued ident (`propname`).
#   el / elif           — safe: `el` has no params.
# Note: `imp` and `from` bind their module param explicitly only (kind = "str"),
# so typing the real keyword `import` never half-matches as `imp` + glued "ort".
# `str` shadows the builtin type name; completion is offer-only so this is safe.

[meta]
language = "python"

[snippets.def]
description = "function definition"
params = [{ name = "name", kind = "ident", default = "func" }]
scope = "fn-body"
body = '''
def ${name}($1):
	${child}
'''

[[snippets.def.variants]]
context = "type-body"
body = '''
def ${name}(self$1):
	${child}
'''

[snippets.adef]
description = "async function definition"
params = [{ name = "name", kind = "ident", default = "func" }]
scope = "fn-body"
body = '''
async def ${name}($1):
	${child}
'''

[[snippets.adef.variants]]
context = "type-body"
body = '''
async def ${name}(self$1):
	${child}
'''

[snippets.main]
description = "main function with __main__ guard"
scope = "fn-body"
body = '''
def main():
	${child}


if __name__ == "__main__":
	main()
'''

[snippets.ifmain]
description = "__main__ guard block"
body = '''
if __name__ == "__main__":
	${child}
'''

[snippets.fori]
description = "for loop over integer range"
params = [{ name = "var", kind = "ident", default = "i" }, { name = "end", kind = "int", default = "10" }]
scope = "loop"
body = '''
for ${var} in range(${end}):
	${child}
'''

[snippets.fore]
description = "for-each loop over an iterable"
params = [{ name = "var", kind = "ident", default = "item" }]
scope = "loop"
body = '''
for ${var} in ${1:iterable}:
	${child}
'''

[snippets.while]
description = "while loop"
scope = "loop"
body = '''
while ${1:condition}:
	${child}
'''

[snippets.if]
description = "if block"
scope = "conditional"
body = '''
if ${1:condition}:
	${child}
'''

[snippets.el]
description = "else block"
scope = "conditional"
body = '''
else:
	${child}
'''

[snippets.elif]
description = "elif block"
scope = "conditional"
body = '''
elif ${1:condition}:
	${child}
'''

[snippets.match]
description = "match statement"
params = [{ name = "expr", kind = "ident", default = "expr" }]
scope = "match-body"
body = '''
match ${expr}:
	${child}
'''

[snippets.arm]
description = "case clause of a match statement"
body = '''
case ${1:pattern}:
	${child}
'''

[snippets.class]
description = "class definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
class ${name}$1:
	${child}
'''

[snippets.variant]
description = "Enum member"
# Nest inside an `Enum` subclass (`class:Color(Enum)>variant*3`). `${value}`
# binds to a data-driven repeat item, so `variant*@Src` fills one member per
# item; with no data it falls back to the `NAME` tabstop. Assumes
# `from enum import auto`.
body = '''
${value:NAME} = auto()
'''

[snippets.init]
description = "__init__ method"
scope = "fn-body"
body = '''
def __init__(self$1):
	${child}
'''

[snippets.str]
description = "__str__ dunder method"
body = '''
def __str__(self) -> str:
	return f"$0"
'''

[snippets.repr]
description = "__repr__ dunder method"
body = '''
def __repr__(self) -> str:
	return f"{type(self).__name__}($0)"
'''

[snippets.prop]
description = "property getter"
params = [{ name = "name", kind = "ident", default = "value" }]
body = '''
@property
def ${name}(self):
	return self._${name}$0
'''

[snippets.try]
description = "try/except block"
scope = "try-body"
body = '''
try:
	${child}
except ${1:Exception} as ${2:exc}:
	$0
'''

[snippets.exc]
description = "except clause"
scope = "try-body"
body = '''
except ${1:Exception} as ${2:exc}:
	${child}
'''

[snippets.fin]
description = "finally clause"
scope = "try-body"
body = '''
finally:
	${child}
'''

[snippets.with]
description = "with statement (context manager)"
body = '''
with ${1:expr} as ${2:name}:
	${child}
'''

[snippets.ret]
description = "return statement"
body = '''
return $0
'''

[snippets.pr]
description = "print call"
body = '''
print($0)
'''

[snippets.prd]
description = "debug print with f-string = specifier"
body = '''
print(f"{$0=}")
'''

[snippets.raise]
description = "raise an exception"
body = '''
raise ${1:ValueError}($0)
'''

[snippets.aeq]
description = "equality assertion"
body = '''
assert ${1:actual} == $0
'''

[snippets.imp]
description = "import statement"
params = [{ name = "module", default = "module" }]
body = '''
import ${module}$0
'''

[snippets.from]
description = "from-import statement"
params = [{ name = "module", default = "module" }]
body = '''
from ${module} import $0
'''

[snippets.lam]
description = "lambda expression"
body = '''
lambda $1: $0
'''

[snippets.lc]
description = "list comprehension"
body = '''
[${1:expr} for ${2:item} in ${3:iterable}]$0
'''

[snippets.dc]
description = "dict comprehension"
body = '''
{${1:key}: ${2:value} for ${3:item} in ${4:iterable}}$0
'''

[snippets.test]
description = "test function (pytest style)"
params = [{ name = "name", kind = "ident", default = "case" }]
scope = "fn-body"
body = '''
def test_${name}():
	${child}
'''

[snippets.doc]
description = "docstring"
body = '''
"""$0"""
'''

[snippets.todo]
description = "TODO comment"
body = '''
# TODO: $0
'''

[snippets.field]
description = "annotated attribute (dataclass field)"
# `${value}` / `${value.type}` bind to a data-driven repeat item: a
# dataclass's annotated attributes fill `field*@Point` (name + type). With no
# data both fall back to tabstops.
body = '''
${value:name}: ${value.type:type}
'''
