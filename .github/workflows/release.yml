name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p codemmet
      - name: Package
        shell: bash
        run: |
          bin=codemmet
          [ "${{ runner.os }}" = "Windows" ] && bin=codemmet.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$bin" dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "codemmet-${{ github.ref_name }}-${{ matrix.target }}.zip" "$bin"
          else
            tar czf "codemmet-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codemmet-${{ matrix.target }}
          path: dist/codemmet-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
