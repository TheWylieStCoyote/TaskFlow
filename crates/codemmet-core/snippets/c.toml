# Builtin C snippet pack. The C++ pack inherits every trigger here.
#
# Intentional trigger-prefix overlaps (longest trigger wins during resolution):
#   def / default       — `default` wins for the exact word; a #define whose name
#                         starts with "ault" needs `def:aultname`.
#   inc / incl          — `incl` wins for the exact word. Both bind their header
#                         param explicitly only (kind = "str"), so nothing gluey
#                         can collide.
#   fori / free / fn    — safe: no trigger is a prefix of another.
#   pr / prf            — safe: `pr` has no params.
#   el / elif           — safe: `el` has no params.
# `pr` prints a literal trailing \n; `prf` takes the format string verbatim
# (include your own \n), matching printf itself.

[meta]
language = "c"

[snippets.fn]
description = "function definition"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
${1:void} ${name}($2) {
	${child}
}
'''

[snippets.main]
description = "main entry point"
scope = "fn-body"
body = '''
int main(void) {
	${child}
	return 0;
}
'''

[snippets.fori]
description = "for loop over integer range"
params = [{ name = "var", kind = "ident", default = "i" }, { name = "end", kind = "int", default = "10" }]
scope = "loop"
body = '''
for (int ${var} = 0; ${var} < ${end}; ${var}++) {
	${child}
}
'''

[snippets.while]
description = "while loop"
scope = "loop"
body = '''
while (${1:condition}) {
	${child}
}
'''

[snippets.dowhile]
description = "do-while loop"
scope = "loop"
body = '''
do {
	${child}
} while (${1:condition});
'''

[snippets.if]
description = "if block"
scope = "conditional"
body = '''
if (${1:condition}) {
	${child}
}
'''

[snippets.el]
description = "else block"
scope = "conditional"
body = '''
else {
	${child}
}
'''

[snippets.elif]
description = "else-if block"
scope = "conditional"
body = '''
else if (${1:condition}) {
	${child}
}
'''

[snippets.switch]
description = "switch statement"
params = [{ name = "expr", kind = "ident", default = "value" }]
scope = "match-body"
body = '''
switch (${expr}) {
	${child}
}
'''

[snippets.case]
description = "case label with break"
body = '''
case ${1:value}:
	${child}
	break;
'''

[snippets.default]
description = "default label with break"
body = '''
default:
	${child}
	break;
'''

[snippets.struct]
description = "typedef'd struct definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
typedef struct {
	${child}
} ${name};
'''

[snippets.enum]
description = "typedef'd enum definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
typedef enum {
	${child}
} ${name};
'''

[snippets.variant]
description = "enum enumerator"
# Nest inside `enum` (`enum:Color>variant*3`). `${value}` binds to a
# data-driven repeat item, so `variant*@Src` fills one enumerator per item;
# with no data it falls back to the `NAME` tabstop. Inherited by C++.
body = '''
${value:NAME},
'''

[snippets.td]
description = "typedef declaration"
body = '''
typedef ${1:int} ${2:name_t};$0
'''

[snippets.ret]
description = "return statement"
body = '''
return $0;
'''

[snippets.pr]
description = "printf a line to stdout"
body = '''
printf("$0\n");
'''

[snippets.prf]
description = "printf with a format string and arguments"
params = [
  { name = "fmt", default = '%d\n' },
  { name = "args", default = "value" },
]
body = '''
printf("${fmt}", ${args});$0
'''

[snippets.inc]
description = "#include a system header"
params = [{ name = "header", default = "stdio.h" }]
body = '''
#include <${header}>$0
'''

[snippets.incl]
description = "#include a local header"
params = [{ name = "header", default = "header.h" }]
body = '''
#include "${header}"$0
'''

[snippets.def]
description = "#define constant"
params = [{ name = "name", kind = "ident", default = "NAME" }]
body = '''
#define ${name} $0
'''

[snippets.guard]
description = "include guard"
params = [{ name = "name", kind = "ident", default = "HEADER_H" }]
body = '''
#ifndef ${name}
#define ${name}

${child}

#endif /* ${name} */
'''

[snippets.malloc]
description = "malloc a typed buffer"
params = [
  { name = "type", default = "int" },
  { name = "ptr", kind = "ident", default = "ptr" },
  { name = "count", default = "1" },
]
body = '''
${type} *${ptr} = malloc(${count} * sizeof(${type}));$0
'''

[snippets.free]
description = "free a pointer and null it"
params = [{ name = "ptr", kind = "ident", default = "ptr" }]
body = '''
free(${ptr});
${ptr} = NULL;$0
'''

[snippets.sizeof]
description = "sizeof expression"
body = '''
sizeof($0)
'''

[snippets.assert]
description = "assert statement"
body = '''
assert($0);
'''

[snippets.aeq]
description = "equality assertion"
body = '''
assert(${1:actual} == $0);
'''

[snippets.doc]
description = "doc comment line"
body = '''
/** $0 */
'''

[snippets.todo]
description = "TODO comment"
body = '''
// TODO: $0
'''

[snippets.field]
description = "struct field definition"
# `${value}` / `${value.type}` bind to a data-driven repeat item: a struct's
# fields fill `field*@Point` (declared type + name). With no data both fall
# back to tabstops. Inherited by C++.
body = '''
${value.type:Type} ${value:name};
'''

[snippets.hstruct]
description = "include-guarded struct for a header (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "guard>struct:${name}"
