[package]
name = "codemmet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "codemmet"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
codemmet-core = { workspace = true }
codemmet-train = { path = "../codemmet-train", optional = true }
codemmet-tsctx = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
ratatui = { version = "0.29", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["tree-sitter", "train"]
# Syntax-aware context via tree-sitter; disable for a minimal text-only build.
tree-sitter = ["dep:codemmet-tsctx"]
# The interactive syntax trainer (`codemmet train`): a ratatui full-screen TUI
# with a line-based fallback for non-TTY / piped use. The pure trainer core has
# no TUI dependency; only the front end pulls in ratatui (+ its crossterm).
train = ["dep:ratatui", "dep:dirs", "dep:codemmet-train"]

[lints]
workspace = true
