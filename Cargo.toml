[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/codemmet",
    "crates/codemmet-core",
    "crates/codemmet-train",
    "crates/codemmet-tsctx",
    "crates/codemmet-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Wylie Standage-Beier <wstandagebeier@gmail.com>"]
description = "Emmet-style abbreviation expansion for programming languages"
keywords = ["emmet", "snippets", "lsp", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
codemmet-core = { path = "crates/codemmet-core", version = "0.3.0" }
codemmet-tsctx = { path = "crates/codemmet-tsctx", version = "0.3.0" }

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tree-sitter = "0.26.10"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

# dev-dependencies
insta = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
