[package]
name = "codemmet-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "WebAssembly bindings for the codemmet browser playground"

[lib]
crate-type = ["cdylib"]

# No workspace dependency inheritance here: the playground needs codemmet-core
# built without its `dirs` feature so it compiles for wasm32-unknown-unknown.
[dependencies]
codemmet-core = { path = "../codemmet-core", default-features = false }
codemmet-train = { path = "../codemmet-train" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
