# Builtin Rust snippet pack.
#
# Intentional trigger-prefix overlaps (longest trigger wins during resolution):
#   let / letm / letq   — glued idents starting with "m"/"q" (e.g. `letmax`) resolve
#                         to letm/letq, not `let` with var "max". Use `let:max`.
#   impl / implt        — `implt` wins for the exact word; `impl<ident>` glue still
#                         works for anything not starting with "t".
#   match / matchres    — `matchres` wins for the exact word; match on a variable
#                         literally named "res" needs `match:res`.
#   if / ifl, el / elif, pr / prd / prf — safe: the shorter trigger has no ident param.

[meta]
language = "rust"

[snippets.fn]
description = "function definition"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
fn ${name}($1) {
	${child}
}
'''

[[snippets.fn.variants]]
context = "type-body"
body = '''
fn ${name}(&self$1) {
	${child}
}
'''

[snippets.rfn]
description = "function returning Result"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
fn ${name}($1) -> Result<${2:()}, ${3:Box<dyn std::error::Error>}> {
	${child}
}
'''

[[snippets.rfn.variants]]
context = "type-body"
body = '''
fn ${name}(&self$1) -> Result<${2:()}, ${3:Box<dyn std::error::Error>}> {
	${child}
}
'''

[snippets.afn]
description = "async function definition"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
async fn ${name}($1) {
	${child}
}
'''

[[snippets.afn.variants]]
context = "type-body"
body = '''
async fn ${name}(&self$1) {
	${child}
}
'''

[snippets.main]
description = "main entry point"
scope = "fn-body"
body = '''
fn main() {
	${child}
}
'''

[snippets.fori]
description = "for loop over integer range"
params = [{ name = "var", kind = "ident", default = "i" }, { name = "end", kind = "int", default = "10" }]
scope = "loop"
body = '''
for ${var} in 0..${end} {
	${child}
}
'''

[snippets.fore]
description = "for-each loop over an iterator"
params = [{ name = "var", kind = "ident", default = "item" }]
scope = "loop"
body = '''
for ${var} in ${1:iterable} {
	${child}
}
'''

[snippets.while]
description = "while loop"
scope = "loop"
body = '''
while ${1:condition} {
	${child}
}
'''

[snippets.wl]
description = "while let loop"
scope = "loop"
body = '''
while let ${1:Some(value)} = ${2:expr} {
	${child}
}
'''

[snippets.loop]
description = "infinite loop"
scope = "loop"
body = '''
loop {
	${child}
}
'''

[snippets.if]
description = "if block"
scope = "conditional"
body = '''
if ${1:condition} {
	${child}
}
'''

[snippets.ifl]
description = "if let block"
scope = "conditional"
body = '''
if let ${1:Some(value)} = ${2:expr} {
	${child}
}
'''

[snippets.el]
description = "else block"
scope = "conditional"
body = '''
else {
	${child}
}
'''

[snippets.elif]
description = "else-if block"
scope = "conditional"
body = '''
else if ${1:condition} {
	${child}
}
'''

[snippets.match]
description = "match expression"
params = [{ name = "expr", kind = "ident", default = "expr" }]
scope = "match-body"
body = '''
match ${expr} {
	${child}
}
'''

[snippets.matchres]
description = "match on a Result with Ok/Err arms"
body = '''
match ${1:expr} {
	Ok(${2:value}) => $3,
	Err(${4:err}) => $0,
}
'''

[snippets.arm]
description = "match arm"
# `${value}` binds to a data-driven repeat item (`match:Msg>arm*` fills one arm
# per variant); with no data it falls back to the `pattern` placeholder.
body = '''
${value:pattern} => $0,
'''

[snippets.struct]
description = "struct definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
body = '''
struct ${name} {
	${child}
}
'''

[snippets.field]
description = "struct field definition"
# `${value}` / `${value.type}` bind to a data-driven repeat item: a struct's
# fields fill `field*@Point` (name + declared type). With no data both fall
# back to tabstops.
body = '''
${value:name}: ${value.type:Type},
'''

[snippets.enum]
description = "enum definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
body = '''
enum ${name} {
	${child}
}
'''

[snippets.variant]
description = "enum variant"
# Nest inside `enum` (`enum:Color>variant*3`). `${value}` binds to a
# data-driven repeat item, so `variant*@Src` fills one variant per item; with
# no data it falls back to the `Name` tabstop.
body = '''
${value:Name},
'''

[snippets.trait]
description = "trait definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
trait ${name} {
	${child}
}
'''

[snippets.impl]
description = "inherent impl block"
params = [{ name = "name", kind = "ident", default = "Type" }]
scope = "type-body"
body = '''
impl ${name} {
	${child}
}
'''

[snippets.implt]
description = "trait impl block (impl Trait for Type)"
scope = "type-body"
body = '''
impl ${1:Trait} for ${2:Type} {
	${child}
}
'''

[snippets.mod]
description = "inline module"
params = [{ name = "name", kind = "ident", default = "name" }]
body = '''
mod ${name} {
	${child}
}
'''

[snippets.derive]
description = "derive attribute"
body = '''
#[derive(${1:Debug, Clone})]$0
'''

[snippets.let]
description = "let binding"
params = [{ name = "name", kind = "ident", default = "name" }]
body = '''
let ${name} = $0;
'''

[snippets.letm]
description = "let mut binding"
params = [{ name = "name", kind = "ident", default = "name" }]
body = '''
let mut ${name} = $0;
'''

[snippets.letq]
description = "let binding from a fallible expression with ?"
params = [{ name = "name", kind = "ident", default = "name" }]
body = '''
let ${name} = $0?;
'''

[snippets.const]
description = "const item"
params = [{ name = "name", kind = "ident", default = "NAME" }]
body = '''
const ${name}: ${1:Type} = $0;
'''

[snippets.ret]
description = "return statement"
body = '''
return $0;
'''

[snippets.pr]
description = "println! to stdout"
body = '''
println!("$0");
'''

[snippets.prf]
description = "println! with a format string and arguments"
params = [
  { name = "fmt", default = "{}" },
  { name = "args", default = "value" },
]
body = '''
println!("${fmt}", ${args});$0
'''

[snippets.prd]
description = "debug-print a value with {:?}"
body = '''
println!("{:?}", $0);
'''

[snippets.epr]
description = "eprintln! to stderr"
body = '''
eprintln!("$0");
'''

[snippets.use]
description = "use declaration"
params = [{ name = "path", default = "path::to::item" }]
body = '''
use ${path};$0
'''

[snippets.doc]
description = "doc comment line"
body = '''
/// $0
'''

[snippets.todo]
description = "TODO comment"
body = '''
// TODO: $0
'''

[snippets.cl]
description = "closure"
body = '''
|${1:args}| $0
'''

[snippets.vec]
description = "vec! literal"
body = '''
vec![$0]
'''

[snippets.hmap]
description = "HashMap binding"
# `requires`: editors insert the missing `use` alongside the expansion, so
# the body uses the bare name. Plain-CLI/no-tree-sitter output reports the
# requirement (`--json`) instead of qualifying it.
requires = ["std::collections::HashMap"]
body = '''
let mut ${1:map} = HashMap::new();$0
'''

[snippets.test]
description = "test function"
params = [{ name = "name", kind = "ident", default = "it_works" }]
scope = "fn-body"
body = '''
#[test]
fn ${name}() {
	${child}
}
'''

[snippets.tmod]
description = "test module with cfg(test)"
body = '''
#[cfg(test)]
mod tests {
	use super::*;

	${child}
}
'''

[snippets.mtest]
description = "grouped test case, named ${outer}_${value}"
# The inner node of a nested data-driven repeat: `${outer}` is the enclosing
# repeat's item and `${value}` is this one. So a test matrix
# `mod*[parser,lexer]>mtest*[empty,unicode]` writes `parser_empty`,
# `parser_unicode`, `lexer_empty`, `lexer_unicode`. With no enclosing repeat
# both degrade to tabstops, so a bare `mtest` is still a valid single test.
scope = "fn-body"
body = '''
#[test]
fn ${outer:group}_${value:case}() {
	${child}
}
'''

[snippets.aeq]
description = "assert_eq! statement"
body = '''
assert_eq!(${1:left}, $0);
'''

[snippets.dstruct]
description = "#[derive]d struct (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "derive+struct:${name}>field"

[snippets.newtype]
description = "struct paired with an impl block (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "(struct:${name}>field)+impl:${name}"

[snippets.testmod]
description = "test module with a first test case (composite)"
expands = "tmod>test"

[snippets.denum]
description = "#[derive]d enum (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "derive+enum:${name}>variant"

[snippets.mmod]
description = "module in a new file, declared from the current file (multi-file)"
params = [{ name = "name", kind = "ident", default = "thing" }]

[snippets.mmod.files.decl]
target = "self"
on_exists = "append"
body = "mod ${name};"

[snippets.mmod.files.module]
path = "${name}.rs"
on_exists = "create"
primary = true
body = '''
pub fn ${name}() {
    $0
}
'''
