[package]
name = "codemmet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core abbreviation-expansion engine for codemmet"
keywords.workspace = true
categories.workspace = true

[features]
default = ["dirs"]
# Platform config-directory lookup (native builds). Disable for WASM/no-home
# targets, where `default_user_snippets_dir` then returns `None`.
dirs = ["dep:dirs"]

[dependencies]
dirs = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
